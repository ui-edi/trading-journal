<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f5bd3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Journal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Trading-Journal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Trading-Journal / Trading journal: Kennzahlen, Kontokurve, Erkenntnisse, Export für Claude · stats, equity curve, insights, export for Claude">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: Logbuch – oben Zeitraum und Ergebnis, darunter Kennzahlen, Kurven und Aufschlüsselung; Erfassen als Blatt von unten */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #e7ebf1;
  --ink: #121722;
  --muted: #5a6474;
  --line: #d4dae2;
  --grid: #e9edf2;
  --accent: #2f5bd3;
  --accent-ink: #ffffff;
  --accent-soft: rgba(47, 91, 211, 0.10);
  --pos: #12805c;
  --pos-soft: rgba(18, 128, 92, 0.12);
  --neg: #c2412d;
  --neg-soft: rgba(194, 65, 45, 0.11);
  --warn: #9a6a00;
  --warn-soft: rgba(154, 106, 0, 0.13);
  --shadow: 0 1px 2px rgba(18, 23, 34, 0.06);
  --font-ui: 'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-num: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117; --surface: #151a21; --surface-2: #1d242d; --ink: #e7ebf1; --muted: #909aa8; --line: #2a323d; --grid: #1f2630;
    --accent: #5f80ee; --accent-ink: #0b1020; --accent-soft: rgba(95, 128, 238, 0.16);
    --pos: #22a676; --pos-soft: rgba(34, 166, 118, 0.16); --neg: #ec5a43; --neg-soft: rgba(236, 90, 67, 0.15);
    --warn: #d9a637; --warn-soft: rgba(217, 166, 55, 0.15); --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117; --surface: #151a21; --surface-2: #1d242d; --ink: #e7ebf1; --muted: #909aa8; --line: #2a323d; --grid: #1f2630;
  --accent: #5f80ee; --accent-ink: #0b1020; --accent-soft: rgba(95, 128, 238, 0.16);
  --pos: #22a676; --pos-soft: rgba(34, 166, 118, 0.16); --neg: #ec5a43; --neg-soft: rgba(236, 90, 67, 0.15);
  --warn: #d9a637; --warn-soft: rgba(217, 166, 55, 0.15); --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-ui); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.pos { color: var(--pos); } .neg { color: var(--neg); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 110px; display: flex; flex-direction: column; gap: 14px; }

/* Kopf */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
.mark { width: 34px; height: 34px; flex: none; border-radius: 9px; background: var(--surface); border: 1px solid var(--line); position: relative; overflow: hidden; }
.mark i { position: absolute; bottom: 7px; width: 4px; border-radius: 2px 2px 0 0; }
.mark i:nth-child(1) { left: 8px; height: 8px; background: var(--neg); }
.mark i:nth-child(2) { left: 15px; height: 14px; background: var(--pos); }
.mark i:nth-child(3) { left: 22px; height: 19px; background: var(--accent); }
.brand h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.015em; line-height: 1.1; }
.brand p { margin: 2px 0 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-right { display: flex; gap: 8px; align-items: center; flex: none; }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; }
.icon-btn svg { width: 19px; height: 19px; }

/* Tabs und Zeitraum */
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 11px; }
.tabs button { flex: 1; border: 0; background: transparent; height: 38px; border-radius: 8px; font-weight: 600; color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.period { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { height: 34px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 13.5px; font-weight: 500; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.custom { display: flex; gap: 8px; flex-wrap: wrap; flex: 1 1 100%; }
.custom input { flex: 1 1 140px; }

.banner { padding: 10px 14px; border-radius: var(--r); font-size: 13.5px; border: 1px solid var(--line); background: var(--surface); display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner.demo { border-color: var(--warn); background: var(--warn-soft); }
.banner.warn { border-color: var(--warn); background: var(--warn-soft); }

/* Karten */
.view { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.card-h h2 { margin: 0; font-size: 15px; font-weight: 700; }
.card p { margin: 0; }
.hint { font-size: 13.5px; color: var(--muted); }
.grid2 { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 860px) { .grid2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }

.hero { display: grid; gap: 4px; }
.hero .lbl { font-size: 13px; color: var(--muted); }
.hero .val { font-size: clamp(40px, 11vw, 56px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.02; }
.hero .val small { font-size: 0.42em; font-weight: 600; letter-spacing: 0; margin-left: 6px; color: var(--muted); }
.hero .sub { font-size: 13.5px; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 620px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.tile span { font-size: 12.5px; color: var(--muted); }
.tile b { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.tile small { font-size: 12px; color: var(--muted); }

.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .ax { font-family: var(--font-num); font-size: 10.5px; fill: var(--muted); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); padding: 7px 10px; border-radius: 8px; font-size: 12.5px; line-height: 1.35; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); z-index: 3; }
.tip b { font-family: var(--font-num); }

.insights { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.insights li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; font-size: 14px; }
.insights li i { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 700; }
.insights li.good i { background: var(--pos-soft); color: var(--pos); }
.insights li.bad i { background: var(--neg-soft); color: var(--neg); }
.insights li.info i { background: var(--accent-soft); color: var(--accent); }

.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.seg button { height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-size: 11.5px; color: var(--muted); font-weight: 600; padding: 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 6px; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.wr { display: inline-block; width: 44px; height: 6px; border-radius: 3px; background: var(--surface-2); vertical-align: middle; margin-right: 6px; overflow: hidden; }
.wr span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

/* Trade-Liste */
.search { display: flex; gap: 8px; }
.search input { flex: 1; }
.list { display: grid; gap: 0; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 12px 4px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer; width: 100%; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--surface-2); }
.row .sym { font-weight: 700; font-size: 15px; }
.row .meta { font-size: 12.5px; color: var(--muted); grid-column: 1; }
.row .res { text-align: right; font-family: var(--font-num); font-weight: 600; grid-row: 1; grid-column: 2; }
.row .rr { text-align: right; font-family: var(--font-num); font-size: 12.5px; color: var(--muted); grid-column: 2; }
.tag { display: inline-block; padding: 0 7px; border-radius: 5px; font-size: 11.5px; font-weight: 600; margin-left: 6px; vertical-align: 1px; }
.tag.l { background: var(--pos-soft); color: var(--pos); }
.tag.s { background: var(--neg-soft); color: var(--neg); }
.tag.n { background: var(--surface-2); color: var(--muted); }
.day { font-size: 12px; font-weight: 600; color: var(--muted); padding: 14px 4px 4px; letter-spacing: 0.02em; }

.empty { text-align: center; padding: 28px 16px; display: grid; gap: 10px; justify-items: center; }
.empty h2 { margin: 0; font-size: 18px; }
.empty p { max-width: 46ch; color: var(--muted); font-size: 14px; }

/* Buttons und Felder */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 42px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; white-space: nowrap; position: relative; overflow: hidden; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--neg); border-color: var(--neg); background: transparent; }
.btn.small { height: 34px; padding: 0 12px; font-size: 13.5px; border-radius: 8px; }
.btn:disabled { opacity: 0.55; cursor: default; }
.btn input[type=file] { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; font-size: 200px; }
.btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
input[type=text], input[type=number], input[type=datetime-local], input[type=date], input[type=search], select, textarea { width: 100%; min-width: 0; height: 42px; padding: 0 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); }
textarea { height: auto; min-height: 76px; padding: 10px 11px; resize: vertical; line-height: 1.45; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > label, .field > .lbl { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.req::after { content: " *"; color: var(--neg); }

.fab { position: fixed; z-index: 20; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); height: 54px; padding: 0 22px; border-radius: 27px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px; box-shadow: 0 6px 18px rgba(20, 30, 60, 0.28); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.fab svg { width: 20px; height: 20px; }

/* Blätter */
.sheet { position: fixed; inset: 0; z-index: 40; background: rgba(8, 12, 18, 0.5); display: grid; place-items: end center; }
@media (min-width: 760px) { .sheet { place-items: center; } }
.sheet-in { width: min(640px, 100%); max-height: 94%; overflow-y: auto; background: var(--surface); border-radius: 16px 16px 0 0; padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 16px; }
@media (min-width: 760px) { .sheet-in { border-radius: 16px; } }
.sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: sticky; top: -18px; background: var(--surface); padding-block: 4px; z-index: 1; }
.sheet-h h2 { margin: 0; font-size: 19px; font-weight: 800; }
.grp { display: grid; gap: 12px; padding-top: 14px; border-top: 1px solid var(--line); }
.grp-h { font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 420px) { .three { grid-template-columns: 1fr 1fr; } }
.pickers { display: flex; flex-wrap: wrap; gap: 6px; }
.pickers button { height: 34px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-size: 13.5px; }
.pickers button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.pickers.dir button[data-v="long"][aria-pressed="true"] { background: var(--pos); border-color: var(--pos); color: #fff; }
.pickers.dir button[data-v="short"][aria-pressed="true"] { background: var(--neg); border-color: var(--neg); color: #fff; }
.pickers.dir button { flex: 1; height: 42px; font-weight: 700; }
.calc { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
.calc div { display: grid; gap: 1px; }
.calc span { font-size: 11.5px; color: var(--muted); }
.calc b { font-family: var(--font-num); font-size: 15px; }
.sheet-foot { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; position: sticky; bottom: calc(-18px - env(safe-area-inset-bottom, 0px)); background: var(--surface); padding-block: 10px; border-top: 1px solid var(--line); }
.sheet-foot .right { display: flex; gap: 8px; margin-left: auto; }

.export-pre { width: 100%; min-height: 140px; font-family: var(--font-num); font-size: 12px; white-space: pre; overflow: auto; }
.steps { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14px; }

.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25); }
.foot { font-size: 12.5px; color: var(--muted); }

.skeleton { height: 120px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); font-size: 14px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

@media (max-width: 480px) { .wr { display: none; } table { font-size: 13px; } td, th { padding-inline: 4px; } }

</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <div style="min-width:0">
        <h1 data-i18n="brand">Trading-Journal</h1>
        <p id="storeLine">…</p>
      </div>
    </div>
    <div class="top-right">
      <button class="icon-btn" id="setBtn" type="button" data-i18n-aria="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs" role="tablist" data-i18n-aria="tabs.aria">
    <button type="button" role="tab" id="tab-overview" data-tab="overview" data-i18n="tab.overview"></button>
    <button type="button" role="tab" id="tab-trades" data-tab="trades" data-i18n="tab.trades"></button>
    <button type="button" role="tab" id="tab-export" data-tab="export" data-i18n="tab.export"></button>
  </nav>

  <div class="period" role="group" data-i18n-aria="period.aria" id="periodBar">
    <button type="button" class="chip" data-p="week" data-i18n="p.week"></button>
    <button type="button" class="chip" data-p="month" data-i18n="p.month"></button>
    <button type="button" class="chip" data-p="3m" data-i18n="p.3m"></button>
    <button type="button" class="chip" data-p="year" data-i18n="p.year"></button>
    <button type="button" class="chip" data-p="all" data-i18n="p.all"></button>
    <button type="button" class="chip" data-p="custom" data-i18n="p.custom"></button>
    <div class="custom" id="customRange" hidden>
      <label class="vh" for="fromDate" data-i18n="from"></label><input type="date" id="fromDate">
      <label class="vh" for="toDate" data-i18n="to"></label><input type="date" id="toDate">
    </div>
  </div>

  <div id="banner" class="banner" hidden></div>

  <section class="view" id="view-overview" role="tabpanel" aria-labelledby="tab-overview"></section>
  <section class="view" id="view-trades" role="tabpanel" aria-labelledby="tab-trades" hidden>
    <div class="card">
      <div class="search"><label class="vh" for="q" data-i18n="search.lbl"></label><input type="search" id="q" data-i18n-ph="search.ph" autocomplete="off"></div>
      <div class="list" id="tradeList"></div>
    </div>
  </section>
  <section class="view" id="view-export" role="tabpanel" aria-labelledby="tab-export" hidden>
    <div class="card">
      <div class="card-h"><h2 data-i18n="exp.claude.h"></h2></div>
      <p class="hint" data-i18n="exp.claude.p"></p>
      <div class="btns" style="margin-top:12px">
        <button type="button" class="btn primary" id="copyClaude" data-i18n="exp.copy"></button>
        <button type="button" class="btn" id="dlCsv" data-i18n="exp.csv"></button>
      </div>
      <p class="hint" id="exportInfo" style="margin-top:10px"></p>
      <label class="vh" for="exportPre" data-i18n="exp.text"></label>
      <textarea class="export-pre" id="exportPre" readonly style="margin-top:10px" hidden></textarea>
    </div>
    <div class="card">
      <div class="card-h"><h2 data-i18n="exp.backup.h"></h2></div>
      <p class="hint" id="backupHint"></p>
      <div class="btns" style="margin-top:12px">
        <button type="button" class="btn" id="dlJson" data-i18n="exp.dlJson"></button>
        <span class="btn"><span data-i18n="exp.import"></span><input type="file" id="importFile" accept=".json,.csv,application/json,text/csv,text/plain" data-i18n-aria="exp.import"></span>
      </div>
    </div>
    <div class="card">
      <div class="card-h"><h2 data-i18n="exp.share.h"></h2></div>
      <p class="hint" id="shareHint"></p>
    </div>
  </section>

  <p class="foot" data-i18n="foot"></p>
</div>

<button type="button" class="fab" id="addBtn" data-i18n-aria="fab.aria">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  <span data-i18n="fab"></span>
</button>

<div class="sheet" id="formSheet" hidden>
  <form class="sheet-in" id="tradeForm" role="dialog" aria-modal="true" aria-labelledby="formTitle" novalidate>
    <div class="sheet-h"><h2 id="formTitle"></h2><button type="button" class="btn small" id="formClose" data-i18n="close"></button></div>

    <div class="grp" style="border-top:0;padding-top:0">
      <div class="two">

    out.push({ c: 'good', t: t('ins.best', { k: b.k, s: fmtMoney(b.sum), cur, n: b.n }) });
    if (w.sum < 0) out.push({ c: 'bad', t: t('ins.worst', { k: w.k, s: fmtMoney(w.sum), cur, n: w.n }) });
  }
  const emo = groupBy(T.filter(x => x.emotion && x.emotion !== 'ruhig'), 'emotion').filter(g => g.n >= 2 && g.avg < 0).sort((a, b) => a.avg - b.avg);
  if (emo.length) out.push({ c: 'bad', t: t('ins.emo', { k: emo[0].k, a: fmtMoney(emo[0].avg), cur, n: emo[0].n }) });
  if (isNum(st.avgW) && isNum(st.avgL) && st.avgW < Math.abs(st.avgL) && st.winRate < 0.6) out.push({ c: 'bad', t: t('ins.lossBig', { l: fmtMoney(st.avgL), w: fmtMoney(st.avgW), wr: fmtPct(st.winRate) }) });
  if (isNum(st.avgW) && isNum(st.avgL) && st.avgW >= 1.5 * Math.abs(st.avgL)) out.push({ c: 'good', t: t('ins.winBig', { x: (st.avgW / Math.abs(st.avgL)).toFixed(1) }) });
  if (isNum(st.avgRiskPct) && st.avgRiskPct > S.settings.riskTarget / 100 * 1.5) out.push({ c: 'bad', t: t('ins.risk', { p: fmtPct(st.avgRiskPct, 1), t: S.settings.riskTarget }) });
  if (st.noStop > 0) out.push({ c: 'bad', t: t('ins.noStop', { a: st.noStop, n: st.n }) });
  const setups = groupBy(T.filter(x => x.setup), 'setup').filter(g => g.n >= 3).sort((a, b) => b.sum - a.sum);
  if (setups.length >= 2) { const a = setups[0], b = setups[setups.length - 1]; out.push({ c: 'info', t: t('ins.setup', { a: a.k, as: fmtMoney(a.sum), an: a.n, b: b.k, bs: fmtMoney(b.sum), cur }) }); }
  return out.slice(0, 6);
}

async function init() {
  render();
  let db = null, id = null;
  if (IN_CLAUDE) {
    window.claude.use('downloads').then(d => { S.dl = d; }).catch(() => { });
    try { const [d, u] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); if (d && u) { id = await u.id(); if (id) db = d; } } catch { db = null; }
  }
  if (db) {
    S.mode = 'db'; S.db = db; S.uid = id;
    S.db.collection('data/users/' + id).onSnapshot(snap => {
      const tr = []; let st = null;
      for (const doc of snap.docs) { const x = doc.data(); if (!x) continue; if (doc.id === 'settings') st = x; else if (x.kind === 'trade') tr.push({ ...x }); }
      S.trades = tr; if (st) { const { kind, ...rest } = st; S.settings = { ...DEFAULT_SETTINGS, ...rest }; }
      S.loaded = true; render();
    }, () => { S.loaded = true; S.lost = true; render(); });
  } else {
    S.mode = 'local';
    const v = lsGet(LS_KEY);
    if (v) { S.trades = Array.isArray(v.trades) ? v.trades : []; S.settings = { ...DEFAULT_SETTINGS, ...(v.settings || {}) }; }
    S.loaded = true; render();
  }
}
function persistLocal() { if (!lsSet(LS_KEY, { trades: S.trades, settings: S.settings })) toast(t('ls.fail')); }
const dbCol = () => S.db.collection('data/users/' + S.uid);
function handleDbErr(e) {
  const c = e && e.code;
  if (c === 'invalid_argument') { S.readonly = true; render(); toast(t('db.readonly')); }
  else if (c === 'quota_exceeded') toast(t('db.quota'));
  else if (c === 'resource_exhausted') toast(t('db.busy'));
  else toast(t('db.fail'));
}
async function putTrade(x) {
  if (S.mode === 'db') { try { await dbCol().doc(x.id).set(x); } catch (e) { handleDbErr(e); throw e; } }
  else { const i = S.trades.findIndex(y => y.id === x.id); if (i >= 0) S.trades[i] = x; else S.trades.push(x); persistLocal(); render(); }
}
async function removeTrade(id) {
  if (S.mode === 'db') { try { await dbCol().doc(id).delete(); } catch (e) { handleDbErr(e); throw e; } }
  else { S.trades = S.trades.filter(x => x.id !== id); persistLocal(); render(); }
}
async function putSettings(st) {
  S.settings = { ...DEFAULT_SETTINGS, ...st };
  if (S.mode === 'db') { try { await dbCol().doc('settings').set({ ...S.settings, kind: 'settings' }); } catch (e) { handleDbErr(e); } }
  else persistLocal();
  render();
}

/* ---------- Charts ---------- */
function niceTicks(min, max, count = 4) {
  if (min === max) { min -= 1; max += 1; }
  const raw = (max - min) / count, mag = 10 ** Math.floor(Math.log10(raw)), f = raw / mag;
  const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, out = [];
  for (let v = lo; v <= hi + step / 2; v += step) out.push(Math.round(v / step) * step);
  return out;
}
function chartFrame(el) { const W = Math.max(280, el.clientWidth || 600), H = Math.round(Math.min(260, Math.max(180, W * 0.42))); return { W, H, L: 46, R: 14, T: 12, B: 24 }; }
function attachHover(el, svg, n, xOf, show) {
  const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; el.appendChild(tip);
  const move = ev => {
    const r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) * (svg.viewBox.baseVal.width / r.width);
    let best = 0, bd = Infinity; for (let i = 0; i < n; i++) { const d = Math.abs(xOf(i) - sx); if (d < bd) { bd = d; best = i; } }
    const pos = show(best, tip); if (!pos) { tip.hidden = true; return; }
    tip.hidden = false;
    const scale = r.width / svg.viewBox.baseVal.width;
    tip.style.left = Math.max(70, Math.min(r.width - 70, pos.x * scale)) + 'px'; tip.style.top = pos.y * scale + 'px';
  };
  svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move);
  svg.addEventListener('pointerleave', () => { tip.hidden = true; show(-1, tip); });
}
function drawEquity(el, st) {
  const { W, H, L, R, T, B } = chartFrame(el), pts = st.curve;
  const ys = pts.map(p => p.eq), ticks = niceTicks(Math.min(...ys), Math.max(...ys));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const X = i => L + (pts.length > 1 ? i / (pts.length - 1) : 0.5) * (W - L - R), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const acc = css('--accent'), grid = css('--grid'), surf = css('--surface'), ink = css('--ink');
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(p.eq).toFixed(1)}`).join('');
  const area = line + `L${X(pts.length - 1).toFixed(1)} ${Y(y0).toFixed(1)}L${X(0).toFixed(1)} ${Y(y0).toFixed(1)}Z`;
  const last = pts[pts.length - 1];
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('c.eq.aria', { a: fmtMoney(pts[0].eq, false), b: fmtMoney(last.eq, false) }))}">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${grid}" stroke-width="1"/><text class="ax" x="${L - 8}" y="${Y(v) + 3.5}" text-anchor="end">${fmtCompact(v)}</text>`).join('')}
    <path d="${area}" fill="${acc}" fill-opacity="0.10"/>
    <path d="${line}" fill="none" stroke="${acc}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(pts.length - 1)}" cy="${Y(last.eq)}" r="5" fill="${acc}" stroke="${surf}" stroke-width="2"/>
    <text class="ax" x="${L}" y="${H - 6}">${esc(t('c.trade', { n: 1 }))}</text><text class="ax" x="${W - R}" y="${H - 6}" text-anchor="end">${esc(t('c.trade', { n: pts.length - 1 }))}</text>
    <line id="eqX" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="${ink}" stroke-opacity="0.35" stroke-width="1" visibility="hidden"/>
    <circle id="eqDot" r="5" fill="${acc}" stroke="${surf}" stroke-width="2" visibility="hidden"/>
    <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>
  </svg>`;
  const svg = el.querySelector('svg'), cx = svg.querySelector('#eqX'), dot = svg.querySelector('#eqDot');
  attachHover(el, svg, pts.length, X, (i, tip) => {
    if (i < 0) { cx.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); return null; }
    const p = pts[i]; cx.setAttribute('x1', X(i)); cx.setAttribute('x2', X(i)); cx.setAttribute('visibility', 'visible');
    dot.setAttribute('cx', X(i)); dot.setAttribute('cy', Y(p.eq)); dot.setAttribute('visibility', 'visible');
    tip.innerHTML = p.t ? `${esc(fmtDate(p.t.openAt))} · ${esc(p.t.symbol)}<br>${esc(t('c.tipTrade'))} <b>${fmtMoney(p.t.pnl)}</b> · ${esc(t('c.tipBal'))} <b>${fmtMoney(p.eq, false)}</b>` : `${esc(t('c.start'))} <b>${fmtMoney(p.eq, false)}</b>`;
    return { x: X(i), y: Y(p.eq) };
  });
}
function drawBars(el, st) {
  const { W, H, L, R, T, B } = chartFrame(el), D = st.T;
  const vals = D.map(x => x.pnl), ticks = niceTicks(Math.min(0, ...vals), Math.max(0, ...vals));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const band = (W - L - R) / Math.max(1, D.length), bw = Math.max(2, Math.min(24, band - 2));
  const X = i => L + band * i + band / 2;
  const pos = css('--pos'), neg = css('--neg'), grid = css('--grid'), axis = css('--muted');
  const bar = (i, v) => {
    const x = X(i) - bw / 2, yz = Y(0), yv = Y(v), h = Math.abs(yv - yz), r = Math.min(4, bw / 2, h);
    if (h < 0.5) return `<rect x="${x}" y="${yz - 0.5}" width="${bw}" height="1" fill="${axis}"/>`;
    if (v > 0) return `<path d="M${x} ${yz}V${yv + r}Q${x} ${yv} ${x + r} ${yv}H${x + bw - r}Q${x + bw} ${yv} ${x + bw} ${yv + r}V${yz}Z" fill="${pos}"/>`;
    return `<path d="M${x} ${yz}V${yv - r}Q${x} ${yv} ${x + r} ${yv}H${x + bw - r}Q${x + bw} ${yv} ${x + bw} ${yv - r}V${yz}Z" fill="${neg}"/>`;
  };
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('c.bars.aria', { w: st.wins, l: st.losses }))}">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${grid}" stroke-width="1"/><text class="ax" x="${L - 8}" y="${Y(v) + 3.5}" text-anchor="end">${fmtCompact(v)}</text>`).join('')}
    <line x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="${axis}" stroke-opacity="0.6" stroke-width="1"/>
    <g>${D.map((x, i) => bar(i, x.pnl)).join('')}</g>
    <rect id="barHi" y="${T}" height="${H - T - B}" width="${band}" fill="${axis}" fill-opacity="0.08" visibility="hidden"/>
    <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>
  </svg>`;
  const svg = el.querySelector('svg'), hi = svg.querySelector('#barHi');
  attachHover(el, svg, D.length, X, (i, tip) => {
    if (i < 0) { hi.setAttribute('visibility', 'hidden'); return null; }
    const x = D[i]; hi.setAttribute('x', X(i) - band / 2); hi.setAttribute('visibility', 'visible');
    const r = rOf(x);
    tip.innerHTML = `${esc(fmtDate(x.openAt))} · ${esc(x.symbol)} ${x.dir === 'short' ? 'Short' : 'Long'}<br><b>${fmtMoney(x.pnl)}</b>${isNum(r) ? ` · <b>${fmtR(r)}</b>` : ''}`;
    return { x: X(i), y: Math.min(Y(x.pnl), Y(0)) };
  });
}

function csvCell(v) { if (v == null) return ''; let s = Array.isArray(v) ? v.join('|') : String(v); if (/[;"\n\r]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"'; return s; }
function toCSV(list) {
  const head = COLS.map(c => LANG === 'de' ? c[1] : c[2]).join(';');
  const rows = sortAsc(list).map(x => COLS.map(([k]) => {
    if (k === '_r') { const r = rOf(x); return isNum(r) ? r.toFixed(2) : ''; }
    if (k === '_pips') { const m = movePips(x); return m && isNum(m.v) ? m.v.toFixed(m.unit === 'pips' ? 1 : 4) : ''; }
    return csvCell(x[k]);
  }).join(';'));
  return [head, ...rows].join('\n');
}
function claudeText(list) {
  const st = computeStats(list, allTrades()), cur = S.settings.currency;
  const pf = st.pf === Infinity ? '∞' : isNum(st.pf) ? st.pf.toFixed(2) : '–';
  return [
    t('x.title'),
    `${t('x.period')}: ${periodLabel()} · ${t('x.cur')}: ${cur}${isNum(S.settings.start) ? ` · ${t('x.start')}: ${S.settings.start}` : ''} · ${t('x.risk')}: ${S.settings.riskTarget} %`,
    t('x.kpi', { n: st.n, wr: fmtPct(st.winRate), sum: fmtMoney(st.sum), cur, pf, r: fmtR(st.avgR), exp: fmtMoney(st.exp), dd: fmtMoney(st.maxDD, false) }),
    '', t('x.ask'), '', t('x.csv'), toCSV(list),
  ].join('\n');
}
function fileStamp() { const { from, to } = periodRange(); return `${from ? toDateInput(from) : 'all'}_${toDateInput(to || new Date())}`; }
async function saveFile(filename, data, mime) {
  if (IN_CLAUDE) {
    if (!S.dl) { try { S.dl = await window.claude.use('downloads'); } catch { S.dl = null; } }
    if (S.dl) {
      try { await S.dl.save({ filename, data }); toast(t('file.saved')); return true; }
      catch (e) { if (e && e.code === 'declined') return false; if (e && e.code === 'rate_limited') { toast(t('file.wait')); return false; } }
    }
    showExportText(data, t('file.manual')); return false;
  }
  try {
    const url = URL.createObjectURL(new Blob([data], { type: mime }));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast(t('file.saved')); return true;
  } catch { showExportText(data, t('file.manual')); return false; }
}
function showExportText(text, msg) { const p = $('exportPre'); p.value = text; p.hidden = false; $('exportInfo').textContent = msg || ''; p.focus(); p.select(); }
function renderExport() {
  const list = inPeriod(allTrades());
  $('exportInfo').textContent = t('exp.info', { n: list.length, period: periodLabel() });
  $('copyClaude').disabled = $('dlCsv').disabled = !list.length;
  $('backupHint').textContent = S.mode === 'db' ? t('exp.backup.db') : t('exp.backup.local');
  $('shareHint').innerHTML = IN_CLAUDE ? t('exp.share.claude') : t('exp.share.web');
}

/* ---------- Import ---------- */
function parseCSVText(text) {
  const rows = []; let row = [], cell = '', q = false;
  const first = text.split('\n')[0];
  const sep = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ';' : ',';
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === sep) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  const head = (rows.shift() || []).map(h => h.replace(/^﻿/, '').trim().toLowerCase());
  const map = {}; head.forEach((h, i) => { const c = COLS.find(x => x.some(n => n.toLowerCase() === h)); if (c) map[i] = c[0]; });
  if (!Object.values(map).includes('pnl') || !Object.values(map).includes('openAt')) throw new Error(t('imp.noCols'));
  return rows.filter(r => r.some(x => x.trim())).map(r => { const o = {}; r.forEach((v, i) => { const k = map[i]; if (k && !k.startsWith('_')) o[k] = v; }); return normTrade(o); });
}
function normTrade(x) {
  const num = v => typeof v === 'number' ? v : parseNum(v);
  return {
    id: x.id && /^t-[\w-]+$/.test(x.id) ? x.id : uid(), kind: 'trade',
    openAt: String(x.openAt || '').slice(0, 16), closeAt: x.closeAt ? String(x.closeAt).slice(0, 16) : '',
    symbol: String(x.symbol || '').toUpperCase().slice(0, 24), platform: String(x.platform || '').slice(0, 30),
    dir: /short|sell|verkauf/i.test(x.dir || '') ? 'short' : 'long',
    size: num(x.size), entry: num(x.entry), stop: num(x.stop), tp: num(x.tp), exit: num(x.exit), pnl: num(x.pnl),
    tf: String(x.tf || '').slice(0, 6), style: String(x.style || '').slice(0, 20), setup: String(x.setup || '').slice(0, 40),
    conf: Array.isArray(x.conf) ? x.conf.slice(0, 12) : String(x.conf || '').split('|').filter(Boolean).slice(0, 12),
    ampel: String(x.ampel || '').slice(0, 8), plan: String(x.plan || '').slice(0, 12), emotion: String(x.emotion || '').slice(0, 20),
    why: String(x.why || '').slice(0, 2000), lesson: String(x.lesson || '').slice(0, 2000), createdAt: x.createdAt || new Date().toISOString(),
  };
}
async function importFile(file) {
  if (!file) return;
  if (S.demo) { toast(t('imp.demo')); return; }
  try {
    const text = await file.text(); let trades = [], settings = null;
    if (/^\s*\{/.test(text)) {
      const j = JSON.parse(text);
      if (!j || !Array.isArray(j.trades)) throw new Error(t('imp.notBackup'));
      trades = j.trades.map(normTrade); settings = j.settings || null;
    } else trades = parseCSVText(text.replace(/^﻿/, ''));
    trades = trades.filter(x => x.openAt && isNum(x.pnl));
    if (!trades.length) throw new Error(t('imp.noTrades'));
    const known = new Set(S.trades.map(x => x.id)), news = trades.filter(x => !known.has(x.id));
    toast(t('imp.running', { n: news.length }), 6000);
    if (S.mode === 'db') { for (const x of news) { try { await dbCol().doc(x.id).set(x); } catch (e) { handleDbErr(e); break; } } }
    else { S.trades = S.trades.concat(news); persistLocal(); }
    if (settings && !isNum(S.settings.start)) await putSettings({ ...S.settings, ...settings });
    render();
    const dup = trades.length - news.length;
    toast(t('imp.done', { n: news.length }) + (dup ? t('imp.dupes', { n: dup }) : '') + '.', 5000);
  } catch (e) { toast(t('imp.fail', { m: (e && e.message) || t('imp.unreadable') }), 6000); }
}

/* ================= Formular ================= */
function setPick(f, v) {
  S.form[f] = v;
  const g = document.querySelector(`.pickers[data-f="${f}"]`); if (!g) return;
  g.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(Array.isArray(v) ? v.includes(b.dataset.v) : b.dataset.v === v)));
}
function openForm(x) {
  if (S.readonly) { toast(t('form.readonly')); return; }
  if (S.demo) { toast(t('form.demo')); return; }
  S.editing = x ? x.id : null;
  $('formTitle').textContent = x ? t('form.edit') : t('form.new');
  $('delBtn').hidden = !x; $('delBtn').textContent = t('del'); $('delBtn').dataset.confirm = '';
  const nv = v => isNum(v) ? String(v) : '';
  $('fSymbol').value = x ? x.symbol : '';
  $('fPlatform').value = x ? (x.platform || S.settings.platform) : S.settings.platform;
  $('fOpen').value = x ? x.openAt : toLocalInput(new Date());
  $('fClose').value = x ? (x.closeAt || '') : '';
  $('fPnl').value = x ? nv(x.pnl) : ''; $('fSize').value = x ? nv(x.size) : '';
  $('fEntry').value = x ? nv(x.entry) : ''; $('fStop').value = x ? nv(x.stop) : ''; $('fTp').value = x ? nv(x.tp) : ''; $('fExit').value = x ? nv(x.exit) : '';
  $('fWhy').value = x ? (x.why || '') : ''; $('fLesson').value = x ? (x.lesson || '') : '';
  S.form = {};
  ['dir', 'tf', 'style', 'setup', 'ampel', 'plan', 'emotion'].forEach(f => setPick(f, x ? (x[f] || '') : ''));
  setPick('conf', x ? (x.conf || []) : []);
  $('pnlLbl').textContent = t('f.pnl', { cur: S.settings.currency });
  $('symList').innerHTML = [...new Set(S.trades.map(y => y.symbol).filter(Boolean))].slice(0, 30).map(s => `<option value="${esc(s)}"></option>`).join('');
  updateCalc();
  $('formSheet').hidden = false;
  setTimeout(() => { (x ? $('fPnl') : $('fSymbol')).focus(); }, 60);
}
function closeForm() { $('formSheet').hidden = true; S.editing = null; $('addBtn').focus(); }
function readForm() {
  const base = S.editing ? (S.trades.find(y => y.id === S.editing) || {}) : {};
  return normTrade({
    ...base, id: S.editing || uid(),
    symbol: $('fSymbol').value.trim(), platform: $('fPlatform').value, dir: S.form.dir || '',
    openAt: $('fOpen').value, closeAt: $('fClose').value,
    pnl: parseNum($('fPnl').value), size: parseNum($('fSize').value),
    entry: parseNum($('fEntry').value), stop: parseNum($('fStop').value), tp: parseNum($('fTp').value), exit: parseNum($('fExit').value),
    tf: S.form.tf || '', style: S.form.style || '', setup: S.form.setup || '', conf: S.form.conf || [], ampel: S.form.ampel || '', plan: S.form.plan || '', emotion: S.form.emotion || '',
    why: $('fWhy').value.trim(), lesson: $('fLesson').value.trim(), createdAt: base.createdAt,
  });
}
function updateCalc() {
  const x = readForm(); x.dir = S.form.dir || 'long';
  const r = rOf(x), pr = plannedR(x), mv = movePips(x), ra = riskAmt(x), cur = S.settings.currency;
  let bal = null;
  if (isNum(S.settings.start)) bal = S.settings.start + S.trades.filter(y => y.id !== x.id && isNum(y.pnl) && tTime(y) < tTime(x)).reduce((s, y) => s + y.pnl, 0);
  const sd = isNum(x.entry) && isNum(x.stop) ? Math.abs(x.entry - x.stop) : null, ps = pipSize(x.symbol);
  const items = [
    [t('calc.sd'), sd != null ? (ps ? (sd / ps).toFixed(1) + ' ' + t('pips') : sd.toFixed(4).replace(/0+$/, '').replace(/\.$/, '')) : '–'],
    [t('calc.pr'), isNum(pr) ? pr.toFixed(2) + 'R' : '–'],
    [t('calc.r'), isNum(r) ? fmtR(r) : '–'],
    [mv ? t(mv.unit) : t('calc.move'), mv && isNum(mv.v) ? (mv.v > 0 ? '+' : '') + mv.v.toFixed(mv.unit === 'pips' ? 1 : 4) : '–'],
    [t('calc.risk'), ra != null ? `${fmtMoney(ra, false)} ${cur}${bal ? ' · ' + fmtPct(ra / bal, 1) : ''}` : '–'],
  ];
  $('calc').innerHTML = items.map(([a, b]) => `<div><span>${esc(a)}</span><b>${esc(b)}</b></div>`).join('');
}
async function submitForm(e) {
  e.preventDefault();
  const x = readForm();
  if (!S.form.dir) { toast(t('v.dir')); return; }
  x.dir = S.form.dir;
  if (!x.symbol) { toast(t('v.sym')); $('fSymbol').focus(); return; }
  if (!x.openAt) { toast(t('v.open')); $('fOpen').focus(); return; }
  if (!isNum(x.pnl)) { toast(t('v.pnl')); $('fPnl').focus(); return; }
  $('saveBtn').disabled = true;
  const wasEdit = !!S.editing;
  try {
    await putTrade(x);
    if (x.platform && x.platform !== S.settings.platform && !wasEdit) { S.settings.platform = x.platform; if (S.mode === 'local') persistLocal(); }
    closeForm(); toast(wasEdit ? t('saved') : t('saved.new'));
  } catch { /* Meldung kam schon */ }
  finally { $('saveBtn').disabled = false; }
}

/* ================= Beispieldaten ================= */
function startDemo() {
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const syms = [['EURUSD', 1.12, 'MetaTrader'], ['USDCHF', 0.826, 'MetaTrader'], ['XAUUSD', 4150, 'Plus500'], ['BTCUSDT', 98000, 'Binance'], ['GBPUSD', 1.29, 'IG']];
  const setups = ['Trend-Pullback', 'Ausbruch', 'Retest', 'Range', 'Umkehr'], emos = ['ruhig', 'ruhig', 'ruhig', 'ruhig', 'ruhig', 'ungeduldig', 'FOMO', 'Angst'];
  const out = [], now = Date.now();
  for (let k = 0; k < 34; k++) {
    const [sym, px, plat] = syms[Math.floor(rnd() * syms.length)];
    const d = new Date(now - (40 - k) * 864e5 * 1.1 + Math.floor(rnd() * 12) * 36e5);
    d.setHours(7 + Math.floor(rnd() * 15), Math.floor(rnd() * 60));
    const dir = rnd() < 0.55 ? 'short' : 'long', setup = setups[Math.floor(rnd() * setups.length)];
    const emo = emos[Math.floor(rnd() * emos.length)], plan = emo === 'ruhig' ? (rnd() < 0.8 ? 'ja' : 'teilweise') : (rnd() < 0.6 ? 'nein' : 'teilweise');
    const edge = (plan === 'ja' ? 0.25 : -0.25) + (setup === 'Trend-Pullback' ? 0.2 : setup === 'Umkehr' ? -0.25 : 0);
    const win = rnd() < 0.45 + edge * 0.5, rMult = win ? 0.8 + rnd() * 1.8 : -(0.6 + rnd() * 0.5);
    const riskPx = px * (0.0015 + rnd() * 0.002), entry = px * (1 + (rnd() - 0.5) * 0.01), sg = dir === 'long' ? 1 : -1;
    const stop = entry - sg * riskPx, exit = entry + sg * riskPx * rMult, risk = 20 + rnd() * 25;
    const dec = px > 1000 ? 1 : px > 10 ? 2 : 5, rd = v => Math.round(v * 10 ** dec) / 10 ** dec;
    out.push(normTrade({ id: 't-demo' + k, symbol: sym, platform: plat, dir, openAt: toLocalInput(d), entry: rd(entry), stop: rd(stop), tp: rd(entry + sg * riskPx * 2), exit: rd(exit), pnl: Math.round(risk * rMult * 100) / 100, size: 0.1, tf: ['M5', 'M15', 'H1'][Math.floor(rnd() * 3)], style: 'Daytrade', setup, conf: ['Struktur', 'MA', 'RSI'].filter(() => rnd() < 0.7), ampel: plan === 'ja' ? 'gruen' : 'gelb', plan, emotion: emo, why: t('demoWhy'), lesson: '' }));
  }
  S.demoTrades = out; S.demo = true; prefs.period = 'all'; render();
}

/* ================= Einstellungen ================= */
function openSettings() {
  $('sLang').value = prefs.lang || 'auto';
  $('sCur').value = S.settings.currency; $('sStart').value = isNum(S.settings.start) ? S.settings.start : '';
  $('sRisk').value = S.settings.riskTarget; $('sPlat').value = S.settings.platform;
  $('setStore').textContent = S.mode === 'db' ? t('set.store.db', { n: S.trades.length }) : t('set.store.local', { n: S.trades.length });
  $('wipeBtn').textContent = t('wipe'); $('wipeBtn').dataset.confirm = '';
  $('setSheet').hidden = false; setTimeout(() => $('sLang').focus(), 50);
}
function closeSettings() { $('setSheet').hidden = true; $('setBtn').focus(); }

/* ================= Verdrahtung ================= */
function wire() {
  document.querySelector('.tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; prefs.tab = b.dataset.tab; savePrefs(); render(); };
  $('periodBar').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; prefs.period = b.dataset.p; savePrefs(); render(); });
  $('fromDate').onchange = e => { prefs.from = e.target.value; savePrefs(); render(); };
  $('toDate').onchange = e => { prefs.to = e.target.value; savePrefs(); render(); };
  $('q').oninput = () => renderTrades();
  $('addBtn').onclick = () => openForm(null);
  $('formClose').onclick = closeForm; $('formCancel').onclick = closeForm;
  $('formSheet').addEventListener('click', e => { if (e.target === $('formSheet')) closeForm(); });
  $('tradeForm').onsubmit = submitForm;
  document.querySelectorAll('.pickers').forEach(g => g.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; const f = g.dataset.f, v = b.dataset.v;
    if (g.dataset.multi) { const cur = S.form[f] || []; setPick(f, cur.includes(v) ? cur.filter(y => y !== v) : cur.concat(v)); }
    else setPick(f, S.form[f] === v && f !== 'dir' ? '' : v);
    updateCalc();
  }));
  ['fSymbol', 'fEntry', 'fStop', 'fTp', 'fExit', 'fPnl', 'fOpen'].forEach(id => $(id).addEventListener('input', updateCalc));
  $('delBtn').onclick = async () => {
    const b = $('delBtn');
    if (!b.dataset.confirm) { b.dataset.confirm = '1'; b.textContent = t('del.confirm'); return; }
    try { await removeTrade(S.editing); closeForm(); toast(t('deleted')); } catch { }
  };
  $('setBtn').onclick = openSettings; $('setClose').onclick = closeSettings;
  $('setSheet').addEventListener('click', e => { if (e.target === $('setSheet')) closeSettings(); });
  $('setSave').onclick = async () => {
    const newLang = $('sLang').value;
    if (newLang !== prefs.lang) { prefs.lang = newLang; savePrefs(); resolveLang(); applyStatic(); }
    const start = parseNum($('sStart').value), risk = parseNum($('sRisk').value);
    await putSettings({ ...S.settings, currency: $('sCur').value, start, riskTarget: risk && risk > 0 ? risk : 1, platform: $('sPlat').value });
    closeSettings(); toast(t('saved'));
  };
  $('wipeBtn').onclick = async () => {
    const b = $('wipeBtn');
    if (!b.dataset.confirm) { b.dataset.confirm = '1'; b.textContent = t('wipe.confirm', { n: S.trades.length }); return; }
    if (S.mode === 'db') { for (const x of S.trades.slice()) { try { await dbCol().doc(x.id).delete(); } catch (e) { handleDbErr(e); break; } } }
    else { S.trades = []; persistLocal(); }
    closeSettings(); render(); toast(t('wiped'));
  };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('formSheet').hidden) closeForm(); else if (!$('setSheet').hidden) closeSettings(); } });
  $('copyClaude').onclick = async () => {
    const text = claudeText(inPeriod(allTrades()));
    try { await navigator.clipboard.writeText(text); toast(t('copy.ok'), 4500); $('exportPre').hidden = true; }
    catch { showExportText(text, t('copy.manual')); }
  };
  $('dlCsv').onclick = () => saveFile(`trading-journal_${fileStamp()}.csv`, '﻿' + toCSV(inPeriod(allTrades())), 'text/csv');
  $('dlJson').onclick = () => {
    if (!S.trades.length) { toast(t('backup.none')); return; }
    saveFile(`trading-journal_backup_${toDateInput(new Date())}.json`, JSON.stringify({ app: 'trading-journal', version: 1, exportedAt: new Date().toISOString(), settings: S.settings, trades: S.trades }, null, 1), 'application/json');
  };
  $('importFile').onchange = e => { const f = e.target.files[0]; e.target.value = ''; importFile(f); };
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (prefs.tab === 'overview' && S.loaded) renderOverview(); }, 150); });
  const mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
  if (mq && mq.addEventListener) mq.addEventListener('change', () => { if (prefs.tab === 'overview' && S.loaded) renderOverview(); });
  new MutationObserver(() => { if (prefs.tab === 'overview' && S.loaded) renderOverview(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}

resolveLang();
applyStatic();
wire();
init();
})();
